<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="pinkOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }

    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    @keyframes dashFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pingDot {
      0% { r: 3px; opacity: 1; }
      100% { r: 12px; opacity: 0; }
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .bg-orb-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }

    .bg-orb-2 {
      animation: pulseGlow 10s ease-in-out infinite alternate;
      transform-origin: 1000px 320px;
    }

    .card-left {
      animation: floatCard1 6s ease-in-out infinite;
    }

    .card-right {
      animation: floatCard2 7s ease-in-out infinite;
    }

    .animated-line {
      stroke-dasharray: 10 15;
      animation: dashFlow 4s linear infinite;
    }

    .ping-circle {
      animation: pingDot 2s ease-out infinite;
    }

    .live-badge {
      animation: livePulse 2s ease-in-out infinite;
    }

    .title-text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }

    .pill-text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M150 0 V420 M300 0 V420 M450 0 V420 M600 0 V420 M750 0 V420 M900 0 V420 M1050 0 V420" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="bg-orb-1" cx="200" cy="100" r="180" fill="#3b82f6" filter="url(#glow)" opacity="0.4" />
  <circle class="bg-orb-2" cx="1000" cy="320" r="160" fill="#8b5cf6" filter="url(#glow)" opacity="0.4" />
  <circle cx="600" cy="210" r="220" fill="#06b6d4" filter="url(#glow)" opacity="0.15" />

  <!-- DYNAMIC BACKGROUND GRAPH GRAPHICS (Placed behind foreground text) -->
  <!-- Left Decorative Card & Chart -->
  <g class="card-left" opacity="0.55">
    <rect x="60" y="240" width="220" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="80" y="268" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ANOMALY DETECTED</text>
    <text x="80" y="295" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="700">+34.2% Spike</text>
    <!-- mini sparkline -->
    <path d="M 80 340 Q 110 330, 130 345 T 180 310 T 230 335 T 260 290" fill="none" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#softGlow)" />
    <circle cx="260" cy="290" r="4" fill="#ec4899" />
  </g>

  <!-- Right Decorative Card & Chart -->
  <g class="card-right" opacity="0.55">
    <rect x="920" y="60" width="220" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="940" y="88" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ROOT CAUSE ANALYSIS</text>
    <text x="940" y="115" fill="#4ade80" font-family="sans-serif" font-size="20" font-weight="700">99.4% Accuracy</text>
    <!-- mini bars -->
    <rect x="940" y="135" width="24" height="35" rx="4" fill="#334155" />
    <rect x="972" y="125" width="24" height="45" rx="4" fill="#38bdf8" />
    <rect x="1004" y="145" width="24" height="25" rx="4" fill="#334155" />
    <rect x="1036" y="110" width="24" height="60" rx="4" fill="url(#pinkOrange)" />
    <rect x="1068" y="130" width="24" height="40" rx="4" fill="#334155" />
  </g>

  <!-- Connecting Animated Data Wave / Flow (Mid Layer) -->
  <path class="animated-line" d="M 50 380 C 300 380, 350 340, 600 350 C 850 360, 900 390, 1150 370" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />
  <path d="M 50 380 C 300 380, 350 340, 600 350 C 850 360, 900 390, 1150 370" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2" />

  <!-- Animated Ping Node -->
  <g transform="translate(600, 350)">
    <circle class="ping-circle" cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTAINER FOR TITLE & SUBTITLE (Ensures zero overlap / opacity issues) -->
  <!-- Subtle dark backdrop panel behind text for maximum contrast and readability -->
  <rect x="180" y="80" width="840" height="240" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" filter="url(#glow)" />

  <!-- Top Pill / Badge -->
  <g transform="translate(600, 118)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle class="live-badge" cx="-115" cy="0" r="5" fill="#22c55e" />
    <text x="-98" y="4" class="pill-text" fill="#e2e8f0">AUTOMATED METRIC INTELLIGENCE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="195" text-anchor="middle" class="title-text" filter="url(#softGlow)">
    Awesome Automated Metric Insights
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" class="subtitle-text">
    Curated AI Analytics, Anomaly Detection &amp; Root Cause Analysis Tools
  </text>

  <!-- Category Pills Below Subtitle -->
  <g transform="translate(600, 280)">
    <!-- Pill 1 -->
    <g transform="translate(-250, 0)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="75" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">⚡ Anomaly Detection</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="1" />
      <text x="80" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">🔍 Root Cause Analysis</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
      <text x="75" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#5eead4">📊 Metric Monitoring</text>
    </g>
  </g>
</svg>
